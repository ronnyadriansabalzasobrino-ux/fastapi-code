<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Mis Reportes - School System</title>

<link rel="stylesheet" href="css/MyReports.css">

<link rel="stylesheet"
href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

</head>

<body>

<div class="container">

  <app-sidebar></app-sidebar>

  <main class="main">

    <app-topbar></app-topbar>

    <!-- HEADER -->
    <div class="reports-header">

      <div>

        <h1>📊 Mis Reportes</h1>

        <p>
          Aquí puedes ver todos los reportes registrados sobre ti
        </p>

      </div>

    </div>

    <!-- FILTROS -->
    <div class="filters-card">

      <h3>🔍 Filtros</h3>

      <div class="filters-grid">

        <select id="riskFilter">

          <option value="">
            Todos los riesgos
          </option>

          <option value="high">
            HIGH
          </option>

          <option value="medium">
            MEDIUM
          </option>

          <option value="low">
            LOW
          </option>

        </select>

        <select id="stateFilter">

          <option value="">
            Todos los estados
          </option>

          <option value="active">
            ACTIVE
          </option>

          <option value="closed">
            CLOSED
          </option>

        </select>

        <select id="programFilter">

          <option value="">
            Todos los programas
          </option>

        </select>

      </div>

    </div>

    <!-- TABLA -->
    <div class="table-card">

      <table id="reportsTable" class="display">

        <thead>

          <tr>
            <th>Programa</th>
            <th>Riesgo</th>
            <th>Estado</th>
            <th>Tipo alerta</th>
            <th>Fecha</th>
          </tr>

        </thead>

        <tbody></tbody>

      </table>

    </div>

  </main>

</div>

<script src="components/sidebar_component.js"></script>

<script src="components/topbar_component.js"></script>

<script src="./js/MyReports.js"></script>

</body>

</html>
