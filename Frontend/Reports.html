<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Reports - School System</title>

<link rel="stylesheet" href="css/Reports.css">

<link rel="stylesheet"
href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

</head>

<body>

<div class="container">

  <app-sidebar></app-sidebar>

  <main class="main">

    <app-topbar></app-topbar>

    <!-- HEADER -->
    <div class="reports-header">

      <div>
        <h1>📊 Reports Dashboard</h1>

        <p>
          Sistema de alertas académicas S.A.P.E.R
        </p>
      </div>

      <button class="pdf-btn" onclick="generatePDF()">
        📄 Descargar PDF
      </button>

    </div>

    <!-- STATS -->
    <div class="stats-grid">

      <div class="stat-card">
        <h3 id="totalAlerts">0</h3>
        <span>Total Alertas</span>
      </div>

      <div class="stat-card high">
        <h3 id="highAlerts">0</h3>
        <span>HIGH</span>
      </div>

      <div class="stat-card medium">
        <h3 id="mediumAlerts">0</h3>
        <span>MEDIUM</span>
      </div>

      <div class="stat-card low">
        <h3 id="lowAlerts">0</h3>
        <span>LOW</span>
      </div>

    </div>

    <!-- FILTROS -->
    <div class="filters-card">

      <h3>🔍 Filtros</h3>

      <div class="filters-grid">

        <select id="riskFilter">
          <option value="">Todos los riesgos</option>
          <option value="high">HIGH</option>
          <option value="medium">MEDIUM</option>
          <option value="low">LOW</option>
        </select>

        <select id="stateFilter">
          <option value="">Todos los estados</option>
          <option value="active">ACTIVE</option>
          <option value="closed">CLOSED</option>
        </select>

        <select id="programFilter">
          <option value="">Todos los programas</option>
        </select>

        <input
          type="text"
          id="searchStudent"
          placeholder="Buscar estudiante..."
        >

      </div>

    </div>

    <!-- TABLA -->
    <div class="table-card">

      <table id="reportsTable" class="display">

        <thead>
          <tr>
            <th>Estudiante</th>
            <th>Documento</th>
            <th>Programa</th>
            <th>Riesgo</th>
            <th>Estado</th>
            <th>Tipo alerta</th>
            <th>Fecha</th>
          </tr>
        </thead>

        <tbody></tbody>

      </table>

    </div>

  </main>

</div>

<script src="components/sidebar_component.js"></script>
<script src="components/topbar_component.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.31/dist/jspdf.plugin.autotable.min.js"></script>

<script src="./js/Reports.js"></script>

</body>
</html>
