<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Gestión de Docentes</title>

<link rel="stylesheet" href="./css/Teachers.css">

<link rel="stylesheet"
href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

</head>

<body>

<div class="container">

  <app-sidebar></app-sidebar>

  <main class="main">

    <app-topbar></app-topbar>

    <h1>Gestión de Docentes</h1>

    <div class="card">

      <h2>Formulario de docente</h2>

      <input type="hidden" id="teacher_id">

      <input id="name" placeholder="Nombre">
      <input id="last_name" placeholder="Apellido">
      <input id="number_id" placeholder="documento">
      <input id="mail" placeholder="Correo">
      <input id="phone" placeholder="Teléfono">
      <input id="specialty" placeholder="Especialidad">

      <br><br>

      <button class="btn-primary" onclick="saveTeacher()">
        Guardar
      </button>

      <button class="btn-clear" onclick="clearForm()">
        Limpiar
      </button>

    </div>

    <div class="table-card">
      <teachers-table></teachers-table>
    </div>

  </main>

</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script src="./components/sidebar_component.js"></script>
<script src="./components/topbar_component.js"></script>

<script src="./components/teacher_table.js"></script>

<script src="./js/Teachers.js"></script>

</body>
</html>
