<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<link rel="stylesheet" href="css/dashboard.css">


<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#1e3c72;
}

.container{
display:flex;
min-height:100vh;
}

.main{
flex:1;
padding:20px;
overflow:auto;
}

.powerbi-title{
text-align:center;
margin:30px 0 10px;
font-size:22px;
font-weight:bold;
color:#ffffff;
}

.powerbi-section{
background:#1e3c72;
padding:20px;
border-radius:12px;
margin-top:20px;
}

.powerbi-frame{
width:100%;
height:700px;
border:none;
border-radius:12px;
background:white;
}

</style>

</head>

<body>

<div class="container">

  <app-sidebar></app-sidebar>

  <main class="main">

    <app-topbar></app-topbar>

    <div class="powerbi-section">

      <div class="powerbi-title">
        📊 Power BI
      </div>

      <iframe
        class="powerbi-frame"
        src="https://app.powerbi.com/reportEmbed?reportId=28285965-bbed-4404-b8c0-228b8921318a&autoAuth=true&ctid=740be6bd-fd36-470e-94d9-0f0c777fadb9"
        frameborder="0"
        allowFullScreen="true">
      </iframe>

    </div>

  </main>

</div>

<script src="components/sidebar_component.js"></script>
<script src="components/topbar_component.js"></script>

<script src="js/dashboard.js"></script>

<app-modal></app-modal>
<script src="./components/modal_component.js"></script>
<script src="./js/modal.js"></script>

<script src="js/session.js"></script>

</body>
</html>
